name: Deploy to GitHub Pages

# The app is static, so "build" only means regenerating the single-file bundle
# and gathering what the site actually serves.
on:
  push:
    branches: [claude/spanish-michel-thomas-app-eg0drl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the single-file bundle
        run: node build.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data _site/
          cp dist/spanish-out-loud.html _site/
          touch _site/.nojekyll

      - name: Check the build produced something usable
        run: |
          test -s _site/index.html
          test -s _site/spanish-out-loud.html
          test -s _site/data/curriculum.js
          test -s _site/data/reference.js
          grep -q 'id="app"' _site/index.html
          echo "site assembled:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
