<title>Spanish Out Loud</title>
<meta name="description" content="A speaking-first Spanish course built on the Michel Thomas method: build sentences from the first minute, and hold a real conversation at the end of every lesson.">
<style>
/* Warm paper, generous type, nothing that competes with the sentence you are
   trying to produce. The learner should be able to read the prompt from a
   metre away and then look away from the screen entirely. */

:root {
  --bg: #f7f3ec;
  --bg-raised: #fffdf9;
  --ink: #241f1a;
  --ink-soft: #6a6058;
  --line: #e2d9cc;
  --accent: #b3452a;
  --accent-soft: #f4e3dd;
  --good: #2f6b47;
  --mid: #9a6b16;
  --bad: #a33a2c;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(36, 31, 26, .05), 0 8px 24px rgba(36, 31, 26, .06);
}

/* Theme resolves in three states: no stamp (follow the OS), data-theme="dark",
   and data-theme="light". Tokens are redefined for each; components only ever
   read the tokens, so nothing is defined behind a single branch. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17150f;
    --bg-raised: #211e18;
    --ink: #f0e9df;
    --ink-soft: #a79d90;
    --line: #35302a;
    --accent: #e08a6b;
    --accent-soft: #33241d;
    --good: #7cc496;
    --mid: #d8ac54;
    --bad: #e58f7f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}

:root[data-theme="dark"] {
    --bg: #17150f;
    --bg-raised: #211e18;
    --ink: #f0e9df;
    --ink-soft: #a79d90;
    --line: #35302a;
    --accent: #e08a6b;
    --accent-soft: #33241d;
    --good: #7cc496;
    --mid: #d8ac54;
    --bad: #e58f7f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
}

/* The dark-mode button text needs a dark ink, whichever route got us here. */
:root[data-theme="dark"] .btn-primary { color: #1a120e; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 62rem; margin: 0 auto; padding: 2.5rem 1.25rem 6rem; }
.wrap.narrow { max-width: 42rem; }

h1, h2, h3 { line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 1rem; }

/* ---- hero ---- */
.hero { margin-bottom: 2rem; }
.eyebrow {
  font: 600 .78rem/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
  margin-bottom: .9rem;
}
.hero h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); margin: 0 0 .8rem; }
.lede { font-size: 1.1rem; color: var(--ink-soft); max-width: 44rem; }

/* ---- stats ---- */
.stats { display: flex; gap: 2.5rem; flex-wrap: wrap; margin: 0 0 1.75rem; }
.stat { display: flex; flex-direction: column; }
.stat strong { font-size: 1.9rem; line-height: 1; }
.stat span {
  font: 500 .78rem/1.4 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; margin-top: .35rem;
}

/* ---- buttons ---- */
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: 1.25rem 0; }
.row-tight { margin: .75rem 0 0; }

.btn {
  font: 600 .95rem/1 ui-sans-serif, system-ui, sans-serif;
  padding: .8rem 1.2rem; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg-raised); color: var(--ink);
  cursor: pointer; transition: transform .06s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: var(--ink-soft); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-primary { color: #1a120e; } }
.btn-primary:hover { filter: brightness(1.06); }

.btn-small { padding: .55rem .85rem; font-size: .85rem; }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn-quiet:hover { color: var(--ink); border-color: var(--line); }
.btn-good { border-color: var(--good); color: var(--good); }
.btn-mid  { border-color: var(--mid);  color: var(--mid); }
.btn-bad  { border-color: var(--bad);  color: var(--bad); }
.btn-live { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* The replay control sits in the corner of whatever it replays, so it never
   interrupts the line the learner is reading. */
.btn-icon {
  position: absolute; top: .7rem; right: .7rem;
  width: 2.1rem; height: 2.1rem; padding: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; line-height: 1; border-radius: 50%;
  background: transparent; border-color: transparent; color: var(--ink-soft);
}
.btn-icon:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.chip {
  font: 500 .82rem/1 ui-sans-serif, system-ui, sans-serif;
  padding: .5rem .8rem; border-radius: 999px;
  border: 1px dashed var(--line); background: transparent; color: var(--ink-soft); cursor: pointer;
}
.chip:hover { border-style: solid; color: var(--accent); border-color: var(--accent); }
.chip-done { border-style: solid; color: var(--good); border-color: var(--good); }

/* ---- lesson list ---- */
.section {
  font: 600 .8rem/1 ui-sans-serif, system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft);
  margin: 2.5rem 0 1rem;
}
.lessons { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }

.lesson {
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.25rem 1.4rem; box-shadow: var(--shadow);
}
.lesson-touched { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.lesson-head { display: flex; align-items: flex-start; gap: .9rem; }
.lesson-num {
  font: 600 .8rem/1.9 ui-sans-serif, system-ui, sans-serif;
  width: 1.9rem; height: 1.9rem; flex: none; text-align: center;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent);
}
.lesson-title { flex: 1; }
.lesson-title h3 { margin: 0; font-size: 1.15rem; }
.lesson-pct { font: 600 .82rem/1.9 ui-sans-serif, system-ui, sans-serif; color: var(--ink-soft); }
.goal { margin: .8rem 0 .7rem; color: var(--ink-soft); font-size: .95rem; }
.muted { color: var(--ink-soft); font-size: .92rem; margin: .15rem 0 0; }

.bar { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar-slim { margin-bottom: 2rem; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }

/* ---- topbar ---- */
.topbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
.topbar-label {
  font: 500 .82rem/1 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink-soft); letter-spacing: .04em;
}
.screen-title { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 .7rem; }

/* ---- building blocks ---- */
.blocks { list-style: none; padding: 0; margin: 0 0 1.5rem; display: grid; gap: .7rem; }
.block {
  position: relative;
  padding-right: 3.2rem;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0; padding: 1rem 1.2rem;
}
.block-rule { margin: 0; font-weight: 600; }
.block-ex {
  margin: .45rem 0 0; color: var(--ink-soft);
  font: .95rem/1.7 ui-monospace, "SF Mono", Menlo, monospace;
}

/* ---- drill ---- */
.card {
  position: relative;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.6rem; box-shadow: var(--shadow); margin-bottom: 1.25rem;
}
.label {
  font: 600 .72rem/1 ui-sans-serif, system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); margin: 0 0 .8rem;
}
.prompt { font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 0; line-height: 1.3; padding-right: 2rem; }
.answer { font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 0; line-height: 1.3; padding-right: 2rem; color: var(--accent); }
.answer-card { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

.tag {
  display: inline-block; margin-bottom: .8rem;
  font: 600 .68rem/1 ui-sans-serif, system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: .1em;
  padding: .35rem .6rem; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}

.coach { color: var(--ink-soft); font-size: .95rem; font-style: italic; }
.note {
  margin: 1rem 0 0; padding-top: .9rem; border-top: 1px solid var(--line);
  color: var(--ink-soft); font-size: .92rem;
}
.heard { color: var(--ink-soft); font-size: .92rem; }

.verdict { margin: 1rem 0 0; font-weight: 600; font-size: .95rem; }
.verdict-right { color: var(--good); }
.verdict-close { color: var(--mid); }
.verdict-wrong { color: var(--bad); }

/* ---- inputs ---- */
.input {
  font: 1rem/1.4 ui-sans-serif, system-ui, sans-serif;
  padding: .75rem .9rem; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-raised); color: var(--ink); width: 100%; max-width: 26rem;
}
.input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.input-answer { font-size: 1.15rem; margin: .5rem 0; max-width: 100%; }
.range { width: 12rem; accent-color: var(--accent); }
.range-row { display: flex; align-items: center; gap: .8rem; }
.range-val { font: .85rem/1 ui-monospace, Menlo, monospace; color: var(--ink-soft); }

/* ---- settings ---- */
.settings {
  margin-top: 3rem; border-top: 1px solid var(--line); padding-top: 1rem;
  font-family: ui-sans-serif, system-ui, sans-serif; font-size: .92rem;
}
.settings summary { cursor: pointer; color: var(--ink-soft); font-weight: 600; }
.settings summary:hover { color: var(--ink); }
.setting { display: flex; flex-direction: column; gap: .4rem; margin: 1.1rem 0; }
.setting > label { font-weight: 600; font-size: .85rem; }
.setting-toggle { flex-direction: row; align-items: center; gap: .6rem; cursor: pointer; }
.setting-toggle input { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
.setting-toggle span { font-weight: 400; color: var(--ink-soft); }
.warn {
  background: var(--accent-soft); color: var(--accent);
  padding: .8rem 1rem; border-radius: 10px; font-size: .9rem; margin: 1rem 0;
}

/* ---- conversation ---- */
.setting-line { color: var(--ink-soft); font-style: italic; margin-bottom: 2rem; }
.thread { display: grid; gap: 1rem; }

.turn {
  position: relative;
  border-radius: var(--radius); padding: 1.1rem 3.2rem 1.1rem 1.3rem;
  border: 1px solid var(--line); background: var(--bg-raised);
}
.turn-them { border-left: 3px solid var(--ink-soft); }
.turn-you {
  border-left: 3px solid var(--accent);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--bg-raised));
  margin-left: clamp(0px, 6vw, 3rem);
}
.turn-current { box-shadow: var(--shadow); }

.turn-es { margin: 0; font-size: 1.2rem; line-height: 1.45; }
.turn-you .turn-es { color: var(--accent); }
.turn-en { margin: .4rem 0 0; color: var(--ink-soft); font-size: .95rem; }
.turn-cue {
  margin: 0; font: 600 1rem/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--ink);
}

@media (max-width: 30rem) {
  .wrap { padding: 1.5rem 1rem 5rem; }
  .stats { gap: 1.5rem; }
  .btn { padding: .7rem 1rem; }
}

/* ---- reference shelf ---- */
.shelf {
  display: block; width: 100%; text-align: left; margin-top: 1.5rem; cursor: pointer;
  background: var(--bg-raised); border: 1px dashed var(--line);
  border-radius: var(--radius); padding: 1.3rem 1.5rem;
  font-family: inherit; color: inherit;
}
.shelf:hover { border-style: solid; border-color: var(--accent); }
.shelf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shelf h3 { margin: 0 0 .5rem; font-size: 1.15rem; }
.shelf p { margin: 0 0 .7rem; color: var(--ink-soft); font-size: .95rem; }
.shelf-counts {
  font: 600 .78rem/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
}

.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1.5rem 0 1rem; border-bottom: 1px solid var(--line); }
.tab {
  font: 600 .92rem/1 ui-sans-serif, system-ui, sans-serif;
  padding: .75rem 1rem; cursor: pointer;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--ink-soft); margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab-on { color: var(--accent); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.ref-search { margin: 0 0 2rem; }
.ref-search .input { max-width: 24rem; }

.ref-group { margin-bottom: 2.75rem; }
.ref-group-title {
  font-size: 1.05rem; margin: 0 0 .3rem;
  padding-bottom: .5rem; border-bottom: 1px solid var(--line);
}
.ref-group-note { margin: .6rem 0 1rem; color: var(--ink-soft); font-size: .92rem; font-style: italic; }

.ref-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: .1rem 2rem; }
.ref-item { display: flex; gap: .5rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.ref-body { flex: 1; min-width: 0; }
.ref-es { margin: 0; font-weight: 600; }
.ref-en { margin: .1rem 0 0; color: var(--ink-soft); font-size: .95rem; }
.ref-lit { margin: .25rem 0 0; color: var(--ink-soft); font-size: .88rem; font-style: italic; }
.ref-note {
  margin: .25rem 0 0; font: .82rem/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--ink-soft);
}

/* Inline replay, as opposed to the corner-pinned one on cards. */
.btn-play {
  position: static; flex: none;
  width: 1.9rem; height: 1.9rem; padding: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem; line-height: 1; border-radius: 50%;
  background: transparent; border-color: transparent; color: var(--ink-soft);
}
.btn-play:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* ---- Spanish vs English ---- */
.contrast-list { display: grid; gap: 1rem; }
.contrast {
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.4rem 1.5rem;
}
.contrast-title { margin: 0 0 1rem; font-size: 1.15rem; }
.contrast-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.contrast-side { padding-left: .9rem; border-left: 2px solid var(--line); }
.contrast-side p { margin: .3rem 0 0; font-size: .95rem; }
.contrast-es { border-left-color: var(--accent); }
.contrast-lang {
  font: 600 .68rem/1 ui-sans-serif, system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft);
}
.contrast-es .contrast-lang { color: var(--accent); }
.contrast-why { margin: 0 0 1rem; color: var(--ink-soft); font-size: .95rem; }
.contrast-examples { border-top: 1px solid var(--line); padding-top: .3rem; }
.contrast-examples .ref-item:last-child { border-bottom: none; padding-bottom: 0; }

@media (max-width: 34rem) {
  .contrast-pair { grid-template-columns: 1fr; gap: .8rem; }
  .ref-list { grid-template-columns: 1fr; }
}
</style>

<div id="app"></div>
<noscript>
  <p style="padding:2rem;font:1rem/1.6 system-ui">This course is interactive and needs JavaScript switched on.</p>
</noscript>

<script>
/* ===== data/curriculum.js ===== */
/* Michel Thomas–style Spanish curriculum.
 *
 * Design rules borrowed from the method itself:
 *   1. Nothing appears in an item that has not been introduced as a block.
 *   2. Every new block is immediately combined with everything before it.
 *   3. Prompts are English; the learner produces Spanish out loud.
 *   4. Conversations are built only from material the learner already owns,
 *      so a "real" exchange is reachable from lesson one.
 *
 * Item shape: { en, es, alt?, note? }
 *   alt  - other fully acceptable answers (typed mode accepts any of them)
 *   note - shown after the reveal, never before (no pre-loading the answer)
 */

window.MT = window.MT || {};

window.MT.curriculum = [
  {
    id: 'l1',
    title: 'You already speak Spanish',
    subtitle: 'Cognates, es, and the question that costs nothing',
    goal: 'Say and negate a real Spanish sentence, and ask a question, within ten minutes.',
    blocks: [
      { rule: '-ible / -able stay the same', ex: 'possible → posible · terrible → terrible · probable → probable' },
      { rule: '-ent / -ant become -ente / -ante', ex: 'important → importante · different → diferente · urgent → urgente' },
      { rule: 'es = it is', ex: 'Es posible. — It is possible.' },
      { rule: 'no goes in front of the verb', ex: 'No es posible. — It is not possible.' },
      { rule: 'A question is the same sentence with a rise at the end', ex: '¿Es posible? — Is it possible?' },
      { rule: 'para mí = for me · para usted = for you', ex: 'Es importante para mí.' }
    ],
    items: [
      { en: 'It is possible.', es: 'Es posible.' },
      { en: 'It is not possible.', es: 'No es posible.' },
      { en: 'Is it possible?', es: '¿Es posible?' },
      { en: 'It is very important.', es: 'Es muy importante.' },
      { en: 'It is not important for me.', es: 'No es importante para mí.' },
      { en: 'Is it important for you?', es: '¿Es importante para usted?' },
      { en: 'It is terrible.', es: 'Es terrible.' },
      { en: 'It is very interesting.', es: 'Es muy interesante.' },
      { en: 'It is not necessary.', es: 'No es necesario.' },
      { en: 'Is it necessary for me?', es: '¿Es necesario para mí?' },
      { en: 'It is different.', es: 'Es diferente.' },
      { en: 'It is urgent.', es: 'Es urgente.' },
      { en: 'It is not urgent for you.', es: 'No es urgente para usted.' },
      { en: 'It is impossible for me.', es: 'Es imposible para mí.' },
      { en: 'It is difficult.', es: 'Es difícil.', note: 'difícil — stress the middle: di-FÍ-cil.' },
      { en: 'It is not difficult, it is easy.', es: 'No es difícil, es fácil.' },
      { en: 'Is it difficult for you?', es: '¿Es difícil para usted?' },
      { en: 'It is excellent.', es: 'Es excelente.' },
      { en: 'It is perfect.', es: 'Es perfecto.' },
      { en: 'It is not perfect, but it is good.', es: 'No es perfecto, pero es bueno.', note: 'pero = but · bueno = good' },
      { en: 'It is very good for me.', es: 'Es muy bueno para mí.' },
      { en: 'Is it possible for you today?', es: '¿Es posible para usted hoy?', note: 'hoy = today' },
      { en: 'It is not possible today, it is impossible.', es: 'No es posible hoy, es imposible.' }
    ],
    conversations: [
      {
        id: 'c1a',
        title: 'At the desk',
        setting: 'Someone at a hotel desk is checking whether a change can be made.',
        turns: [
          { who: 'them', es: '¿Es posible hoy?', en: 'Is it possible today?' },
          { who: 'you', cue: 'Say: No, it is not possible today.', es: 'No, no es posible hoy.' },
          { who: 'them', es: '¿Es posible mañana?', en: 'Is it possible tomorrow?', note: 'mañana = tomorrow' },
          { who: 'you', cue: 'Say: Yes, tomorrow it is possible.', es: 'Sí, mañana es posible.' },
          { who: 'them', es: 'Perfecto. ¿Es urgente para usted?', en: 'Perfect. Is it urgent for you?' },
          { who: 'you', cue: 'Say: It is not urgent, but it is important for me.', es: 'No es urgente, pero es importante para mí.' },
          { who: 'them', es: 'Muy bien. No es difícil.', en: 'Very good. It is not difficult.' },
          { who: 'you', cue: 'Say: Excellent. Thank you.', es: 'Excelente. Gracias.', note: 'gracias = thank you' }
        ]
      }
    ]
  },

  {
    id: 'l2',
    title: 'I want — and the whole verb comes free',
    subtitle: 'quiero / quiere + any infinitive',
    goal: 'Attach every verb you meet to "I want" and "do you want" without conjugating anything.',
    blocks: [
      { rule: 'quiero = I want · quiere = you want (usted) / he · she wants', ex: 'Quiero comer. — I want to eat.' },
      { rule: 'Verbs in the dictionary end in -ar, -er, -ir. That form already means "to ..."', ex: 'hablar = to speak · comer = to eat · ir = to go' },
      { rule: 'After quiero / quiere, nothing changes — just add the verb', ex: 'Quiero hablar. ¿Quiere hablar?' },
      { rule: 'lo = it, and it hooks onto the end of the verb', ex: 'comprarlo = to buy it · Quiero comprarlo.' },
      { rule: 'Useful verbs', ex: 'hablar · comer · comprar · ir · ver (to see) · hacer (to do/make) · probar (to try) · reservar' }
    ],
    items: [
      { en: 'I want to speak Spanish.', es: 'Quiero hablar español.' },
      { en: 'I want to speak Spanish with you.', es: 'Quiero hablar español con usted.', note: 'con = with' },
      { en: 'Do you want to speak Spanish?', es: '¿Quiere hablar español?' },
      { en: 'I do not want to speak English.', es: 'No quiero hablar inglés.' },
      { en: 'I want to eat.', es: 'Quiero comer.' },
      { en: 'Do you want to eat now?', es: '¿Quiere comer ahora?', note: 'ahora = now' },
      { en: 'I do not want to eat now.', es: 'No quiero comer ahora.' },

/* ===== js/storage.js ===== */
/* Progress persistence. Everything lives in localStorage — no account, no server. */
window.MT = window.MT || {};

(function (MT) {
  'use strict';

  var KEY = 'mt-spanish-progress-v1';
  var SETTINGS_KEY = 'mt-spanish-settings-v1';

  var defaults = {
    items: {},          // itemKey -> { box, due, seen, right, wrong }
    lessonsStarted: {}, // lessonId -> timestamp
    conversationsDone: {},
    streak: { count: 0, lastDay: null },
    totals: { answered: 0, right: 0 }
  };

  var defaultSettings = {
    voice: '',          // preferred voice name, '' = auto
    rate: 0.85,         // Michel Thomas pace: unhurried
    autoPlay: true,     // speak the answer on reveal
    typed: false,       // typing is opt-in; the method is spoken
    showEnglish: true   // show English under partner turns in conversations
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return clone(fallback);
      var parsed = JSON.parse(raw);
      var out = clone(fallback);
      Object.keys(parsed).forEach(function (k) { out[k] = parsed[k]; });
      return out;
    } catch (e) {
      return clone(fallback);
    }
  }

  var writable = true;

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      // Private browsing, or a sandboxed frame with storage switched off.
      writable = false;
    }
  }

  var state = read(KEY, defaults);
  var settings = read(SETTINGS_KEY, defaultSettings);

  MT.store = {
    state: state,
    settings: settings,

    // False once a write has actually failed, so the app can be honest about it.
    canSave: function () { return writable; },

    save: function () { write(KEY, state); },
    saveSettings: function () { write(SETTINGS_KEY, settings); },

    set: function (name, value) {
      settings[name] = value;
      this.saveSettings();
    },

    item: function (key) {
      return state.items[key] || null;
    },

    recordItem: function (key, record) {
      state.items[key] = record;
      this.save();
    },

    markLessonStarted: function (lessonId) {
      if (!state.lessonsStarted[lessonId]) {
        state.lessonsStarted[lessonId] = Date.now();
        this.save();
      }
    },

    markConversationDone: function (id) {
      state.conversationsDone[id] = Date.now();
      this.save();
    },

    countAnswer: function (correct) {
      state.totals.answered += 1;
      if (correct) state.totals.right += 1;
      this.touchStreak();
      this.save();
    },

    touchStreak: function () {
      var today = new Date().toISOString().slice(0, 10);
      var s = state.streak;
      if (s.lastDay === today) return;
      var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      s.count = (s.lastDay === yesterday) ? s.count + 1 : 1;
      s.lastDay = today;
    },

    reset: function () {
      state = clone(defaults);
      MT.store.state = state;
      this.save();
    }
  };
})(window.MT);

/* ===== js/engine.js ===== */
/* Drill engine: answer checking and the spacing schedule.
 *
 * The method says: never let something you got wrong disappear, and never
 * drill something in isolation. So items live in Leitner boxes and every
 * session mixes new material with whatever is due from earlier lessons.
 */
window.MT = window.MT || {};

(function (MT) {
  'use strict';

  // Box 0 is "just missed" — it comes back inside the same session.
  var INTERVALS_MIN = [0, 10, 60 * 24, 60 * 24 * 3, 60 * 24 * 7, 60 * 24 * 21];

  function key(lessonId, index) { return lessonId + ':' + index; }

  function normalize(s) {
    return (s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')  // strip accents — never penalise them in typing
      .replace(/[¿?¡!.,;:"'()]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function accepts(item) {
    return [item.es].concat(item.alt || []).map(normalize);
  }

  /* Returns 'right' | 'close' | 'wrong'.
     'close' = the words are there but something small is off, which in this
     method is a nudge, not a failure. */
  function check(item, answer) {
    var given = normalize(answer);
    if (!given) return 'wrong';
    var targets = accepts(item);
    if (targets.indexOf(given) !== -1) return 'right';

    var best = 0;
    targets.forEach(function (t) {
      var score = similarity(given, t);
      if (score > best) best = score;
    });
    if (best >= 0.9) return 'close';
    return 'wrong';
  }

  // Token-level overlap, order-sensitive enough to catch real word errors.
  function similarity(a, b) {
    if (a === b) return 1;
    var aw = a.split(' '), bw = b.split(' ');
    var matched = 0;
    var pool = bw.slice();
    aw.forEach(function (w) {
      var i = pool.indexOf(w);
      if (i !== -1) { matched++; pool.splice(i, 1); }
    });
    var lenPenalty = Math.abs(aw.length - bw.length) * 0.5;
    return Math.max(0, (matched - lenPenalty) / Math.max(aw.length, bw.length));
  }

  function due(record, now) {
    if (!record) return true;
    return record.due <= now;
  }

  function schedule(record, grade) {
    var now = Date.now();
    var r = record || { box: 0, due: now, seen: 0, right: 0, wrong: 0 };
    r.seen += 1;

    if (grade === 'right') {
      r.right += 1;
      r.box = Math.min(r.box + 1, INTERVALS_MIN.length - 1);
    } else if (grade === 'close') {
      r.right += 1;
      // Stays put: you produced it, but not cleanly enough to promote.
      r.box = Math.max(r.box, 1);
    } else {
      r.wrong += 1;
      r.box = 0; // straight back into this session
    }

    r.due = now + INTERVALS_MIN[r.box] * 60000;
    return r;
  }

  /* Build a session queue for one lesson: its own items, plus due items
     drawn from every earlier lesson, woven in rather than bolted on. */
  function buildLessonQueue(lesson, allLessons, opts) {
    opts = opts || {};
    var now = Date.now();
    var fresh = lesson.items.map(function (item, i) {
      return { item: item, lessonId: lesson.id, index: i, key: key(lesson.id, i), isReview: false };
    });

    var review = [];
    allLessons.forEach(function (l) {
      if (l.id === lesson.id) return;
      l.items.forEach(function (item, i) {
        var k = key(l.id, i);
        var rec = MT.store.item(k);
        if (rec && due(rec, now)) {
          review.push({ item: item, lessonId: l.id, index: i, key: k, isReview: true });
        }
      });
    });

    shuffle(review);
    review = review.slice(0, opts.maxReview == null ? 8 : opts.maxReview);

    // Interleave: a review item roughly every fourth prompt.
    var out = [];
    var ri = 0;
    fresh.forEach(function (entry, i) {
      out.push(entry);
      if (i > 0 && i % 4 === 0 && ri < review.length) out.push(review[ri++]);
    });
    while (ri < review.length) out.push(review[ri++]);
    return out;
  }

  /* Everything due right now, across the whole course. */
  function buildReviewQueue(allLessons, limit) {
    var now = Date.now();
    var out = [];
    allLessons.forEach(function (l) {
      l.items.forEach(function (item, i) {
        var k = key(l.id, i);
        var rec = MT.store.item(k);
        if (rec && due(rec, now)) {
          out.push({ item: item, lessonId: l.id, index: i, key: k, isReview: true, box: rec.box });
        }
      });
    });
    out.sort(function (a, b) { return a.box - b.box; }); // shakiest first
    return limit ? out.slice(0, limit) : out;
  }

  /* Two different questions, two different numbers:
     - strength: how well is this lesson holding up? Each clean recall moves an
       item a third of the way, so one good pass shows real progress instead of
       a demoralising 0%, but 100% still needs recall spread over several days.
     - covered: have you actually been through the material? This is what
       decides when to point the learner at the next lesson. */
  var MASTERY_BOX = 3;

  function lessonProgress(lesson) {
    var strong = 0, seen = 0, covered = 0, strength = 0;
    lesson.items.forEach(function (item, i) {
      var rec = MT.store.item(key(lesson.id, i));
      if (!rec) return;
      seen++;
      if (rec.box >= 1) covered++;
      if (rec.box >= MASTERY_BOX) strong++;
      strength += Math.min(rec.box, MASTERY_BOX) / MASTERY_BOX;
    });
    var total = lesson.items.length;
    return {
      seen: seen,
      covered: covered,
      strong: strong,
      total: total,
      pct: total ? Math.round((strength / total) * 100) : 0
    };
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  MT.engine = {
    key: key,
    normalize: normalize,
    check: check,
    schedule: schedule,
    buildLessonQueue: buildLessonQueue,
    buildReviewQueue: buildReviewQueue,
    lessonProgress: lessonProgress,
    countDue: function (allLessons) { return buildReviewQueue(allLessons).length; },
    shuffle: shuffle
  };
})(window.MT);

/* ===== js/speech.js ===== */
/* Voice: the method lives in the ear, not on the page.
 * Text-to-speech is required for the app to feel right; speech recognition
 * is a bonus where the browser offers it (Chrome/Edge), never a requirement. */
window.MT = window.MT || {};

(function (MT) {
  'use strict';

  var synth = window.speechSynthesis || null;
  var voices = [];
  var ready = false;

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices() || [];
    if (voices.length) ready = true;
  }

  if (synth) {
    loadVoices();
    if (typeof synth.addEventListener === 'function') {
      synth.addEventListener('voiceschanged', loadVoices);
    } else {
      synth.onvoiceschanged = loadVoices;
    }
  }

  function spanishVoices() {
    return voices.filter(function (v) { return /^es(-|_|$)/i.test(v.lang); });
  }

  function pickVoice(lang) {
    if (!voices.length) loadVoices();
    var wanted = MT.store.settings.voice;
    if (wanted) {
      var chosen = voices.filter(function (v) { return v.name === wanted; })[0];
      if (chosen && (lang !== 'en' || /^en/i.test(chosen.lang))) return chosen;
    }
    if (lang === 'en') {
      return voices.filter(function (v) { return /^en(-|_|$)/i.test(v.lang); })[0] || null;
    }
    var es = spanishVoices();
    // Prefer a peninsular or Mexican voice; either is fine for the learner.
    var preferred = ['es-ES', 'es-MX', 'es-US', 'es-419'];
    for (var i = 0; i < preferred.length; i++) {
      var match = es.filter(function (v) { return v.lang.replace('_', '-') === preferred[i]; })[0];
      if (match) return match;
    }
    return es[0] || null;
  }

  var current = null;

  function speak(text, opts) {
    opts = opts || {};
    if (!synth || !text) return Promise.resolve(false);
    return new Promise(function (resolve) {
      try {
        synth.cancel();
        var u = new SpeechSynthesisUtterance(text);
        var lang = opts.lang === 'en' ? 'en' : 'es';
        var voice = pickVoice(lang);
        if (voice) u.voice = voice;
        u.lang = voice ? voice.lang : (lang === 'en' ? 'en-GB' : 'es-ES');
        u.rate = opts.rate != null ? opts.rate : (lang === 'en' ? 1 : MT.store.settings.rate);
        u.pitch = 1;
        u.onend = function () { current = null; resolve(true); };
        u.onerror = function () { current = null; resolve(false); };
        current = u;
        synth.speak(u);
      } catch (e) {
        resolve(false);
      }
    });
  }

  function stop() {
    if (synth) { try { synth.cancel(); } catch (e) {} }
    current = null;
  }

  /* ---- Speech recognition (optional) ---- */

  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var recognizer = null;

  function listen(onResult, onEnd) {
    if (!Recognition) { if (onEnd) onEnd('unsupported'); return null; }
    try { if (recognizer) recognizer.abort(); } catch (e) {}
    var r = new Recognition();
    var voice = pickVoice('es');
    r.lang = voice ? voice.lang.replace('_', '-') : 'es-ES';
    r.interimResults = true;
    r.maxAlternatives = 3;
    r.continuous = false;

    r.onresult = function (event) {
      var result = event.results[event.results.length - 1];
      var alternatives = [];
      for (var i = 0; i < result.length; i++) alternatives.push(result[i].transcript);
      onResult(alternatives[0] || '', result.isFinal, alternatives);
    };
    r.onerror = function (e) { if (onEnd) onEnd(e.error || 'error'); };
    r.onend = function () { if (onEnd) onEnd(null); };

    try { r.start(); } catch (e) { if (onEnd) onEnd('start-failed'); return null; }
    recognizer = r;
    return r;
  }

  function stopListening() {
    if (recognizer) { try { recognizer.stop(); } catch (e) {} }
  }

  MT.speech = {
    supported: !!synth,
    recognitionSupported: !!Recognition,
    speak: speak,
    stop: stop,
    listen: listen,
    stopListening: stopListening,
    voices: function () { if (!voices.length) loadVoices(); return voices; },
    spanishVoices: function () { if (!voices.length) loadVoices(); return spanishVoices(); },
    hasSpanishVoice: function () { if (!voices.length) loadVoices(); return spanishVoices().length > 0; }
  };
})(window.MT);

/* ===== js/app.js ===== */
/* View controller.
 *
 * Three screens matter: the course map, the drill, and the conversation.
 * Everything is keyboard-first, because the learner's hands should be free
 * and their eyes should be off the screen while they answer.
 */
(function (MT) {
  'use strict';

  var course = MT.curriculum;
  var view = { name: 'home' };
  var session = null;

  /* ---------- helpers ---------- */

  function el(tag, attrs, children) {
    var node = document.createElement(tag);

      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null && attrs[k] !== false) node.setAttribute(k, attrs[k]);
    });

      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);

    MT.speech.stop();
    MT.speech.stopListening();
    view = next;
    render();
  }

    var due = MT.engine.countDue(course);
    var totals = MT.store.state.totals;
    var streak = MT.store.state.streak.count;

    var header = el('header', { class: 'hero' }, [
      el('p', { class: 'eyebrow', text: 'Spanish · the Michel Thomas way' }),
      el('h1', { text: 'You are not going to memorise anything.' }),
      el('p', { class: 'lede', text: 'Listen, then say it out loud before you look. Nothing to write down, nothing to revise. If you forget something it will come back to you on its own — that is the app’s job, not yours.' })
    ]);

    var stats = el('div', { class: 'stats' }, [
      stat(streak, streak === 1 ? 'day in a row' : 'days in a row'),
      stat(totals.answered, 'sentences produced'),
      stat(due, due === 1 ? 'item due' : 'items due')
    ]);

    var actions = el('div', { class: 'row' }, [
      due > 0 ? el('button', {
        class: 'btn btn-primary',
        onclick: function () { startReview(); }
      }, ['Review what is due (' + due + ')']) : null,
      el('button', {
        class: due > 0 ? 'btn' : 'btn btn-primary',
        onclick: function () { startNextLesson(); }
      }, [nextLessonLabel()])
    ]);

    // Probe once, so a page that cannot persist says so rather than quietly
    // losing the learner's work.
    MT.store.touchStreak(); MT.store.save();
    var noSave = !MT.store.canSave() ? el('p', { class: 'warn', text: 'This page cannot save to browser storage here, so progress will not survive a reload. Everything else works.' }) : null;

    var list = el('ol', { class: 'lessons' }, course.map(function (lesson, i) {
      return lessonCard(lesson, i);
    }));

    // The shelf is deliberately outside the course: look things up here, but
    // do not mistake reading a list for learning.
    var shelf = el('button', { class: 'shelf', onclick: function () { go({ name: 'reference', tab: 'sayings', q: '' }); } }, [
      el('h3', { text: 'The reference shelf' }),
      el('p', { text: 'Sayings people actually use, a working vocabulary, and the points where Spanish and English genuinely disagree. Nothing here is drilled or scheduled — it is for looking things up.' }),
      el('span', { class: 'shelf-counts', text: countSayings() + ' sayings · ' + countWords() + ' words · ' + countContrasts() + ' grammar contrasts' })
    ]);

    var main = el('main', { class: 'wrap' }, [
      header, noSave, stats, actions,
      el('h2', { class: 'section', text: 'The course' }),
      list,
      shelf,
      renderSettings()

    app.appendChild(main);

      el('span', { text: label })

      class: 'input',

    }, [el('option', { value: '', text: 'Automatic' })].concat(
      voices.map(function (v) {
        return el('option', { value: v.name, text: v.name + ' (' + v.lang + ')', selected: s.voice === v.name });
      })
    ));

    var rateInput = el('input', {
      type: 'range', min: '0.5', max: '1.2', step: '0.05', value: String(s.rate), class: 'range',
      oninput: function (e) {

    } else if (!MT.speech.hasSpanishVoice()) {

    }

      el('summary', { text: 'Settings' }),
      warn,
      el('div', { class: 'setting' }, [
        el('label', { text: 'Spanish voice' }), voiceSelect
      ]),
      el('div', { class: 'setting' }, [
        el('label', { text: 'Speaking pace' }),
        el('div', { class: 'range-row' }, [rateInput, el('span', { class: 'range-val', text: s.rate.toFixed(2) + '×' })])

      el('input', {
        type: 'checkbox', checked: !!MT.store.settings[name],
        onchange: function (e) { MT.store.set(name, e.target.checked); }
      }),
      el('span', { text: label })
    ]);
  }

  /* ---------- building blocks ---------- */

  function renderBlocks() {
    var lesson = lessonById(view.lessonId);
    MT.store.markLessonStarted(lesson.id);

    var main = el('main', { class: 'wrap narrow' }, [
      backBar(lesson.title),
      el('h1', { class: 'screen-title', text: lesson.title }),
      el('p', { class: 'lede', text: lesson.goal }),
      el('h2', { class: 'section', text: 'What you are about to be given' }),
      el('ul', { class: 'blocks' }, lesson.blocks.map(function (b) {
        return el('li', { class: 'block' }, [
          el('p', { class: 'block-rule', text: b.rule }),
          b.ex ? el('p', { class: 'block-ex', text: b.ex }) : null,
          b.ex ? el('button', {
            class: 'btn btn-icon', title: 'Hear it',
            onclick: function () { MT.speech.speak(spanishOnly(b.ex)); }
          }, ['♪']) : null
        ]);
      })),
      el('p', { class: 'muted', text: 'Read these once. Do not try to hold on to them — you are about to use them, and using them is what makes them stick.' }),
      el('div', { class: 'row' }, [
        el('button', { class: 'btn btn-primary', onclick: function () { startLesson(lesson); } }, ['Start speaking →'])
      ])
    ]);

    clear(app);
    app.appendChild(main);
  }

  // Pull the Spanish half out of an example line like "possible → posible".
  function spanishOnly(ex) {
    return ex.split('·').map(function (part) {
      var halves = part.split(/→|—|-{1,2}\s/);
      return (halves.length > 1 ? halves[1] : halves[0]).trim();
    }).join(', ');
  }

  function backBar(label) {
    return el('div', { class: 'topbar' }, [
      el('button', { class: 'btn btn-quiet', onclick: function () { go({ name: 'home' }); } }, ['← Course']),
      el('span', { class: 'topbar-label', text: label || '' })
    ]);
  }

  /* ---------- drill ---------- */

  function startLesson(lesson) {
    var queue = MT.engine.buildLessonQueue(lesson, course, { maxReview: 8 });
    session = { queue: queue, pos: 0, revealed: false, title: lesson.title, kind: 'lesson', heard: '', verdict: null, right: 0, listening: false };
    go({ name: 'drill', lessonId: lesson.id });
  }

  function startReview() {
    var queue = MT.engine.buildReviewQueue(course, 30);
    if (!queue.length) return;
    session = { queue: queue, pos: 0, revealed: false, title: 'Review', kind: 'review', heard: '', verdict: null, right: 0, listening: false };
    go({ name: 'drill' });
  }

  function renderDrill() {
    if (!session || session.pos >= session.queue.length) return renderDone();

    var entry = session.queue[session.pos];
    var item = entry.item;
    var total = session.queue.length;
    var pct = Math.round((session.pos / total) * 100);

    var promptCard = el('div', { class: 'card prompt-card' }, [
      entry.isReview ? el('span', { class: 'tag', text: 'from earlier' }) : null,
      el('p', { class: 'label', text: 'Say this in Spanish' }),
      el('p', { class: 'prompt', text: item.en }),
      el('button', {
        class: 'btn btn-icon', title: 'Hear the English prompt',
        onclick: function () { MT.speech.speak(item.en, { lang: 'en', rate: 1 }); }
      }, ['♪'])
    ]);

    var body = [promptCard];

    if (!session.revealed) {
      body.push(el('p', { class: 'coach', text: 'Take as long as you like. Work it out, say it out loud, and only then look.' }));

      if (MT.store.settings.typed) {
        var input = el('input', {
          class: 'input input-answer', type: 'text', placeholder: 'Type it here (accents optional)',
          autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
          value: session.heard || '',
          onkeydown: function (e) {
            if (e.key === 'Enter') { session.heard = e.target.value; reveal(entry); }
          }
        });
        body.push(input);
        setTimeout(function () { input.focus(); }, 0);
      }

      var controls = [
        el('button', { class: 'btn btn-primary', onclick: function () { reveal(entry); } }, ['Show me (space)'])
      ];
      if (MT.speech.recognitionSupported) {
        controls.push(el('button', {
          class: 'btn' + (session.listening ? ' btn-live' : ''),
          onclick: function () { toggleListen(entry); }
        }, [session.listening ? '● Listening…' : '● Say it']));
      }
      body.push(el('div', { class: 'row' }, controls));

      if (session.heard && !MT.store.settings.typed) {
        body.push(el('p', { class: 'heard', text: 'Heard: “' + session.heard + '”' }));
      }
    } else {
      var verdict = session.verdict;
      body.push(el('div', { class: 'card answer-card' }, [
        el('p', { class: 'label', text: 'In Spanish' }),
        el('p', { class: 'answer', text: item.es }),
        el('button', {
          class: 'btn btn-icon', title: 'Hear it again (r)',
          onclick: function () { MT.speech.speak(item.es); }
        }, ['♪']),
        item.note ? el('p', { class: 'note', text: item.note }) : null,
        verdict ? el('p', {
          class: 'verdict verdict-' + verdict,
          text: verdict === 'right' ? 'That is it exactly.'
            : verdict === 'close' ? 'Close — compare it word for word.'
            : 'Not yet. Say the correct sentence out loud twice, then move on.'
        }) : null
      ]));

      body.push(el('p', { class: 'coach', text: 'Be honest with yourself here. Nothing is lost by marking it missed — it simply comes back.' }));
      body.push(el('div', { class: 'row' }, [
        el('button', { class: 'btn btn-good', onclick: function () { grade(entry, 'right'); } }, ['Got it  (1)']),
        el('button', { class: 'btn btn-mid', onclick: function () { grade(entry, 'close'); } }, ['Nearly  (2)']),
        el('button', { class: 'btn btn-bad', onclick: function () { grade(entry, 'wrong'); } }, ['Missed  (3)'])
      ]));
    }

    var main = el('main', { class: 'wrap narrow drill' }, [
      backBar(session.title + '  ·  ' + (session.pos + 1) + ' of ' + total),
      el('div', { class: 'bar bar-slim' }, [el('div', { class: 'bar-fill', style: 'width:' + pct + '%' })])
    ].concat(body));

    clear(app);
    app.appendChild(main);
  }

  function toggleListen(entry) {
    if (session.listening) {
      MT.speech.stopListening();
      session.listening = false;
      return render();
    }
    session.listening = true;
    session.heard = '';
    render();
    MT.speech.listen(function (transcript, isFinal) {
      session.heard = transcript;
      if (isFinal) {
        session.listening = false;
        reveal(entry);
      } else {
        render();
      }
    }, function (err) {
      session.listening = false;
      if (err && err !== 'no-speech') session.heard = '';
      render();
    });
  }

  function reveal(entry) {
    MT.speech.stopListening();
    session.listening = false;
    session.revealed = true;
    session.verdict = session.heard ? MT.engine.check(entry.item, session.heard) : null;
    if (MT.store.settings.autoPlay) MT.speech.speak(entry.item.es);
    render();
  }

  function grade(entry, result) {
    var record = MT.engine.schedule(MT.store.item(entry.key), result);
    MT.store.recordItem(entry.key, record);
    MT.store.countAnswer(result !== 'wrong');
    if (result !== 'wrong') session.right += 1;

    // A missed item is re-queued a few places on — inside this same session.
    if (result === 'wrong') {
      var reinsert = Math.min(session.pos + 4, session.queue.length);
      session.queue.splice(reinsert, 0, entry);
    }

    session.pos += 1;
    session.revealed = false;
    session.heard = '';
    session.verdict = null;
    render();
  }

  function renderDone() {
    var lesson = view.lessonId ? lessonById(view.lessonId) : null;
    var total = session ? session.queue.length : 0;
    var right = session ? session.right : 0;

    var next = [];
    if (lesson && lesson.conversations.length) {
      next.push(el('button', {
        class: 'btn btn-primary',
        onclick: function () { go({ name: 'conversation', lessonId: lesson.id, convId: lesson.conversations[0].id }); }
      }, ['Now use it in a conversation →']));
    }
    next.push(el('button', { class: 'btn', onclick: function () { go({ name: 'home' }); } }, ['Back to the course']));

    var main = el('main', { class: 'wrap narrow' }, [
      backBar('Done'),
      el('h1', { class: 'screen-title', text: 'That is the session.' }),
      el('p', { class: 'lede', text: 'You produced ' + total + ' sentences and got ' + right + ' of them. Whatever you missed is already scheduled to come back — you do not have to do anything about it.' }),
      el('div', { class: 'row' }, next)
    ]);

    clear(app);
    app.appendChild(main);
  }

  /* ---------- conversation ---------- */

  function renderConversation() {
    var lesson = lessonById(view.lessonId);
    var conv = lesson.conversations.filter(function (c) { return c.id === view.convId; })[0];

    if (!session || session.kind !== 'conv' || session.convId !== conv.id) {
      session = { kind: 'conv', convId: conv.id, pos: 0, revealed: false, heard: '', verdict: null, listening: false };
      // The other person opens if theirs is the first turn.
      if (conv.turns[0].who === 'them') setTimeout(function () { MT.speech.speak(conv.turns[0].es); }, 250);
    }

    var lines = [];
    for (var i = 0; i <= session.pos && i < conv.turns.length; i++) {
      lines.push(turnNode(conv, conv.turns[i], i));
    }

    var finished = session.pos >= conv.turns.length;
    var footer;
    if (finished) {
      if (!MT.store.state.conversationsDone[conv.id]) MT.store.markConversationDone(conv.id);
      footer = el('div', { class: 'row' }, [
        el('button', { class: 'btn btn-primary', onclick: function () { playWhole(conv); } }, ['Play the whole conversation']),
        el('button', {
          class: 'btn',
          onclick: function () { session = null; go({ name: 'conversation', lessonId: lesson.id, convId: conv.id }); }
        }, ['Run it again']),
        el('button', { class: 'btn btn-quiet', onclick: function () { go({ name: 'home' }); } }, ['Back to the course'])
      ]);
    } else {
      footer = null;
    }

    var main = el('main', { class: 'wrap narrow conv' }, [
      backBar(lesson.title),
      el('h1', { class: 'screen-title', text: conv.title }),
      el('p', { class: 'setting-line', text: conv.setting }),
      el('div', { class: 'thread' }, lines),
      footer
    ]);

    clear(app);
    app.appendChild(main);
    var last = app.querySelector('.turn:last-child');
    if (last && session.pos > 0) last.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function turnNode(conv, turn, index) {
    var isCurrent = index === session.pos;

    if (turn.who === 'them') {
      var node = el('div', { class: 'turn turn-them' }, [
        el('p', { class: 'turn-es', text: turn.es }),
        MT.store.settings.showEnglish ? el('p', { class: 'turn-en', text: turn.en }) : null,
        turn.note ? el('p', { class: 'note', text: turn.note }) : null,
        el('button', { class: 'btn btn-icon', title: 'Hear it again', onclick: function () { MT.speech.speak(turn.es); } }, ['♪'])
      ]);
      if (isCurrent) {
        node.appendChild(el('div', { class: 'row row-tight' }, [
          el('button', {
            class: 'btn btn-primary btn-small',
            onclick: function () { session.pos += 1; render(); autoSpeakCurrent(conv); }
          }, ['Continue (space)'])
        ]));
      }
      return node;
    }

    // Your turn.
    var children = [el('p', { class: 'turn-cue', text: turn.cue })];

    if (isCurrent && !session.revealed) {
      if (MT.store.settings.typed) {
        var input = el('input', {
          class: 'input input-answer', type: 'text', placeholder: 'Your answer',
          autocomplete: 'off', spellcheck: 'false',
          onkeydown: function (e) { if (e.key === 'Enter') { session.heard = e.target.value; revealTurn(turn); } }
        });
        children.push(input);
        setTimeout(function () { input.focus(); }, 0);
      }
      var controls = [
        el('button', { class: 'btn btn-primary btn-small', onclick: function () { revealTurn(turn); } }, ['Show me (space)'])
      ];
      if (MT.speech.recognitionSupported) {
        controls.push(el('button', {
          class: 'btn btn-small' + (session.listening ? ' btn-live' : ''),
          onclick: function () { toggleListenTurn(turn); }
        }, [session.listening ? '● Listening…' : '● Say it']));
      }
      children.push(el('div', { class: 'row row-tight' }, controls));
      if (session.heard) children.push(el('p', { class: 'heard', text: 'Heard: “' + session.heard + '”' }));
    } else if (index < session.pos || session.revealed) {
      children.push(el('p', { class: 'turn-es', text: turn.es }));
      if (turn.note) children.push(el('p', { class: 'note', text: turn.note }));
      children.push(el('button', { class: 'btn btn-icon', title: 'Hear it again', onclick: function () { MT.speech.speak(turn.es); } }, ['♪']));
      if (isCurrent) {
        if (session.verdict) {
          children.push(el('p', {
            class: 'verdict verdict-' + session.verdict,
            text: session.verdict === 'right' ? 'Exactly that.'
              : session.verdict === 'close' ? 'Close — check it word for word.'
              : 'Say the correct line out loud, then carry on.'
          }));
        }
        children.push(el('div', { class: 'row row-tight' }, [
          el('button', {
            class: 'btn btn-primary btn-small',
            onclick: function () { nextTurn(conv); }
          }, ['Continue (space)'])
        ]));
      }
    }

    return el('div', { class: 'turn turn-you' + (isCurrent ? ' turn-current' : '') }, children);
  }

  function revealTurn(turn) {
    MT.speech.stopListening();
    session.listening = false;
    session.revealed = true;
    session.verdict = session.heard ? MT.engine.check(turn, session.heard) : null;
    if (MT.store.settings.autoPlay) MT.speech.speak(turn.es);
    render();
  }

  function toggleListenTurn(turn) {
    if (session.listening) {
      MT.speech.stopListening();
      session.listening = false;
      return render();
    }
    session.listening = true;
    session.heard = '';
    render();
    MT.speech.listen(function (transcript, isFinal) {
      session.heard = transcript;
      if (isFinal) { session.listening = false; revealTurn(turn); }
      else render();
    }, function (err) {
      session.listening = false;
      if (err && err !== 'no-speech') session.heard = '';
      render();
    });
  }

  function nextTurn(conv) {
    session.pos += 1;
    session.revealed = false;
    session.heard = '';
    session.verdict = null;
    render();
    autoSpeakCurrent(conv);
  }

  function autoSpeakCurrent(conv) {
    var turn = conv.turns[session.pos];
    if (turn && turn.who === 'them' && MT.store.settings.autoPlay) {
      setTimeout(function () { MT.speech.speak(turn.es); }, 200);
    }
  }

  function playWhole(conv) {
    var i = 0;
    (function next() {
      if (i >= conv.turns.length) return;
      var turn = conv.turns[i++];
      MT.speech.speak(turn.es).then(function () { setTimeout(next, 350); });
    })();
  }

  /* ---------- reference shelf ---------- */

  function countSayings() { return MT.sayings.reduce(function (n, g) { return n + g.items.length; }, 0); }
  function countWords() { return MT.vocabulary.reduce(function (n, g) { return n + g.items.length; }, 0); }
  function countContrasts() { return MT.contrasts.reduce(function (n, g) { return n + g.items.length; }, 0); }

  var TABS = [
    { id: 'sayings',   label: 'Sayings',           blurb: 'What people actually say. The literal reading is given wherever it is the reason the phrase sticks.' },
    { id: 'words',     label: 'Words',             blurb: 'Nouns carry their article, because the article is the gender — learning a noun without it means learning it twice.' },
    { id: 'contrasts', label: 'Spanish vs English', blurb: 'Not a grammar course: only the points where an English instinct produces wrong Spanish. That is a much shorter list.' }
  ];

  function renderReference() {
    var tab = view.tab || 'sayings';
    var meta = TABS.filter(function (t) { return t.id === tab; })[0];
    var results = el('div', { class: 'ref-results' });

    var search = el('input', {
      class: 'input', type: 'search', placeholder: 'Search English or Spanish…',
      value: view.q || '', autocomplete: 'off', spellcheck: 'false',
      oninput: function (e) { view.q = e.target.value; fillResults(results, tab, view.q); }
    });

    var tabs = el('div', { class: 'tabs' }, TABS.map(function (t) {
      return el('button', {
        class: 'tab' + (t.id === tab ? ' tab-on' : ''),
        onclick: function () { go({ name: 'reference', tab: t.id, q: view.q || '' }); }
      }, [t.label]);
    }));

    var main = el('main', { class: 'wrap' }, [
      backBar('Reference'),
      el('h1', { class: 'screen-title', text: 'The reference shelf' }),
      el('p', { class: 'lede', text: meta.blurb }),
      tabs,
      el('div', { class: 'ref-search' }, [search]),
      results
    ]);

    clear(app);
    app.appendChild(main);
    fillResults(results, tab, view.q || '');
  }

  function matches(q, fields) {
    if (!q) return true;
    var needle = MT.engine.normalize(q);
    if (!needle) return true;
    return fields.some(function (f) {
      return f && MT.engine.normalize(String(f)).indexOf(needle) !== -1;
    });
  }

  // Only the results are rebuilt as you type, so the search box keeps focus.
  function fillResults(container, tab, q) {
    clear(container);
    var groups = tab === 'sayings' ? MT.sayings : tab === 'words' ? MT.vocabulary : MT.contrasts;
    var shown = 0;

    groups.forEach(function (group) {
      var items = group.items.filter(function (i) {
        return tab === 'contrasts'
          ? matches(q, [i.title, i.english, i.spanish, i.why].concat((i.examples || []).map(function (e) { return e.es + ' ' + e.en; })))
          : matches(q, [i.es, i.en, i.lit, i.note]);
      });
      if (!items.length) return;
      shown += items.length;

      container.appendChild(el('div', { class: 'ref-group' }, [
        el('h2', { class: 'ref-group-title', text: group.group }),
        group.note ? el('p', { class: 'ref-group-note', text: group.note }) : null,
        el('div', { class: tab === 'contrasts' ? 'contrast-list' : 'ref-list' },
          items.map(tab === 'contrasts' ? contrastCard : refRow))
      ]));
    });

    if (!shown) {
      container.appendChild(el('p', { class: 'coach', text: 'Nothing matches “' + q + '” here. Try the other tabs — the same word may live under sayings rather than vocabulary.' }));
    }
  }

  function refRow(item) {
    return el('div', { class: 'ref-item' }, [
      el('button', {
        class: 'btn btn-play', title: 'Hear it',
        onclick: function () { MT.speech.speak(item.es); }
      }, ['♪']),
      el('div', { class: 'ref-body' }, [
        el('p', { class: 'ref-es', text: item.es }),
        el('p', { class: 'ref-en', text: item.en }),
        item.lit ? el('p', { class: 'ref-lit', text: 'Literally: ' + item.lit }) : null,
        item.note ? el('p', { class: 'ref-note', text: item.note }) : null
      ])
    ]);
  }

  function contrastCard(item) {
    return el('article', { class: 'contrast' }, [
      el('h3', { class: 'contrast-title', text: item.title }),
      el('div', { class: 'contrast-pair' }, [
        el('div', { class: 'contrast-side' }, [
          el('span', { class: 'contrast-lang', text: 'English' }),
          el('p', { text: item.english })
        ]),
        el('div', { class: 'contrast-side contrast-es' }, [
          el('span', { class: 'contrast-lang', text: 'Spanish' }),
          el('p', { text: item.spanish })
        ])
      ]),
      item.why ? el('p', { class: 'contrast-why', text: item.why }) : null,
      (item.examples || []).length ? el('div', { class: 'contrast-examples' },
        item.examples.map(function (ex) {
          return el('div', { class: 'ref-item' }, [
            el('button', {
              class: 'btn btn-play', title: 'Hear it',
              onclick: function () { MT.speech.speak(ex.es); }
            }, ['♪']),
            el('div', { class: 'ref-body' }, [
              el('p', { class: 'ref-es', text: ex.es }),
              el('p', { class: 'ref-en', text: ex.en }),
              ex.note ? el('p', { class: 'ref-note', text: ex.note }) : null
            ])
          ]);
        })
      ) : null
    ]);
  }

  /* ---------- keyboard ---------- */

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = e.key;

    if (k === 'Escape') { go({ name: 'home' }); return; }

    if (view.name === 'drill' && session) {
      var entry = session.queue[session.pos];
      if (!entry) return;
      if (k === ' ') { e.preventDefault(); if (!session.revealed) reveal(entry); return; }
      if (session.revealed) {
        if (k === '1') return grade(entry, 'right');
        if (k === '2') return grade(entry, 'close');
        if (k === '3') return grade(entry, 'wrong');
        if (k === 'r' || k === 'R') return void MT.speech.speak(entry.item.es);
      }
    }

    if (view.name === 'conversation' && session && session.kind === 'conv') {
      var conv = lessonById(view.lessonId).conversations.filter(function (c) { return c.id === view.convId; })[0];
      var turn = conv.turns[session.pos];
      if (!turn) return;
      if (k === ' ') {
        e.preventDefault();
        if (turn.who === 'them') { session.pos += 1; render(); autoSpeakCurrent(conv); }
        else if (!session.revealed) revealTurn(turn);
        else nextTurn(conv);
        return;
      }
      if (k === 'r' || k === 'R') MT.speech.speak(turn.es);
    }
  });

  /* ---------- boot ---------- */

  function render() {
    if (view.name === 'home') return renderHome();
    if (view.name === 'reference') return renderReference();
    if (view.name === 'blocks') return renderBlocks();
    if (view.name === 'drill') return renderDrill();
    if (view.name === 'conversation') return renderConversation();
    renderHome();
  }

  MT.render = render;
  render();
})(window.MT);
</script>
